<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crop Recommendation | AgriVerse</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    /* ===== General Styles ===== */
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #eaf6ff, #b3e0ff);
      color: #002b5b;
      padding-top: 80px; /* offset for navbar */
      overflow-x: hidden;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 60px 20px;
      min-height: 100vh;
    }

    .form-box {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 40px 50px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 8px 20px rgba(0, 123, 255, 0.15);
      backdrop-filter: blur(10px);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      animation: fadeIn 0.6s ease;
    }

    .form-box:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0, 123, 255, 0.25);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #0077b6;
      font-weight: 700;
      font-size: 2rem;
    }

    label {
      display: block;
      font-weight: 500;
      margin-top: 12px;
      color: #004080;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border: 1px solid #cfe2ff;
      border-radius: 10px;
      background-color: #f8fbff;
      font-size: 15px;
      transition: all 0.2s ease;
    }

    input:focus,
    select:focus {
      border-color: #0077b6;
      outline: none;
      box-shadow: 0 0 6px rgba(0, 123, 255, 0.3);
    }

    button {
      background: linear-gradient(90deg, #0077b6, #00b4d8);
      color: white;
      border: none;
      padding: 14px 20px;
      width: 100%;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 25px;
    }

    button:hover {
      background: linear-gradient(90deg, #005f8a, #0096c7);
      transform: translateY(-2px);
    }

    .result {
      margin-top: 25px;
      text-align: center;
      padding: 18px;
      border-radius: 12px;
      background: #e6f0ff;
      color: #003366;
      display: none;
      font-size: 1.1rem;
      font-weight: 600;
      animation: fadeIn 0.6s ease;
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: #f0f6ff;
      color: #003366;
      margin-top: 60px;
      font-size: 14px;
      border-top: 1px solid rgba(0, 0, 0, 0.05);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ===== Responsive Design ===== */
    @media (max-width: 1024px) {
      .form-box {
        max-width: 80%;
        padding: 35px 30px;
      }
      h2 {
        font-size: 1.8rem;
      }
    }

    @media (max-width: 768px) {
      .container {
        padding: 40px 15px;
      }
      .form-box {
        padding: 30px 20px;
      }
      h2 {
        font-size: 1.6rem;
      }
      input,
      select {
        font-size: 14px;
        padding: 10px;
      }
      button {
        font-size: 15px;
        padding: 12px;
      }
    }

    @media (max-width: 480px) {
      .form-box {
        padding: 25px 15px;
        border-radius: 15px;
      }
      h2 {
        font-size: 1.3rem;
      }
      input,
      select {
        padding: 9px;
        font-size: 13.5px;
      }
      button {
        font-size: 14px;
        padding: 11px;
      }
    }
  </style>
</head>
<body>
  <!-- Include Navbar -->
  {% include 'navbar.html' %}

  <!-- Crop Form Section -->
  <div class="container">
    <div class="form-box">
      <h2>🌱 Smart Crop Recommendation</h2>
      <form id="cropForm" onsubmit="return showPrediction(event)">
        <label for="nitrogen">Nitrogen (N):</label>
        <input type="number" id="nitrogen" name="nitrogen" required>

        <label for="phosphorus">Phosphorus (P):</label>
        <input type="number" id="phosphorus" name="phosphorus" required>

        <label for="potassium">Potassium (K):</label>
        <input type="number" id="potassium" name="potassium" required>

        <label for="temperature">Temperature (°C):</label>
        <input type="number" id="temperature" name="temperature" required>

        <label for="humidity">Humidity (%):</label>
        <input type="number" id="humidity" name="humidity" required>

        <label for="ph">Soil pH:</label>
        <input type="number" step="0.1" id="ph" name="ph" required>

        <label for="rainfall">Rainfall (mm):</label>
        <input type="number" id="rainfall" name="rainfall" required>

        <button type="submit">Predict Best Crop</button>
      </form>

      <div class="result" id="resultBox">
        🌾 Recommended Crop: <span id="cropName">Wheat</span>
      </div>
    </div>
  </div>

  <footer>
    &copy; 2025 AgriVerse | Empowering Farmers with AI 🌿
  </footer>

  <script>
    function showPrediction(event) {
      event.preventDefault();
      document.getElementById("resultBox").style.display = "block";
      document.getElementById("cropName").innerText = "Rice 🌾";
      return false;
    }
  </script>
</body>
</html>
