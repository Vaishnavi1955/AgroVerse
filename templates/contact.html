<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | AgriVerse</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #eaf6ff, #b3e5fc);
      color: #004080;
      padding-top: 80px; /* offset for navbar */
    }

    .contact-container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 30px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 30px;
    }

    .contact-info, .contact-form {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 8px 20px rgba(0, 123, 255, 0.1);
      flex: 1 1 45%;
      min-width: 320px;
      transition: transform 0.3s ease;
      backdrop-filter: blur(8px);
    }

    .contact-info:hover, .contact-form:hover {
      transform: translateY(-5px);
    }

    h1 {
      text-align: center;
      color: #0056b3;
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    p.subtitle {
      text-align: center;
      color: #003366;
      margin-bottom: 40px;
    }

    h2 {
      color: #0077b6;
      font-size: 1.6rem;
      margin-bottom: 20px;
    }

    .info-item {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
      font-size: 1rem;
      color: #004080;
    }

    .info-item i {
      font-size: 1.5rem;
      color: #0077b6;
      margin-right: 15px;
    }

    form label {
      display: block;
      font-weight: 500;
      margin-top: 12px;
      color: #004080;
    }

    form input, form textarea {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border: 1px solid #cfe2ff;
      border-radius: 10px;
      background-color: #f8fbff;
      font-size: 15px;
      transition: all 0.2s;
      resize: none;
    }

    form input:focus, form textarea:focus {
      border-color: #0077b6;
      outline: none;
      box-shadow: 0 0 6px rgba(0, 123, 255, 0.3);
    }

    button {
      background: linear-gradient(90deg, #0077b6, #00b4d8);
      color: white;
      border: none;
      padding: 14px 20px;
      width: 100%;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 20px;
    }

    button:hover {
      background: linear-gradient(90deg, #005f8a, #0096c7);
      transform: translateY(-2px);
    }

    iframe {
      width: 100%;
      border: none;
      border-radius: 15px;
      height: 300px;
      margin-top: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: #f0f6ff;
      color: #003366;
      margin-top: 60px;
      font-size: 14px;
      border-top: 1px solid rgba(0,0,0,0.05);
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .contact-container {
        flex-direction: column;
        padding: 20px;
      }

      .contact-info, .contact-form {
        flex: 1 1 100%;
      }

      h1 {
        font-size: 1.8rem;
      }
    }

    @media (max-width: 480px) {
      .contact-container {
        padding: 15px;
      }

      h1 {
        font-size: 1.5rem;
      }

      .contact-info, .contact-form {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  {% include 'navbar.html' %}

  <div class="contact-container">
    <div class="contact-info">
      <h2>📍 Get in Touch</h2>
      <div class="info-item">
        <i class="fas fa-map-marker-alt"></i> AgriVerse HQ, Pune, India
      </div>
      <div class="info-item">
        <i class="fas fa-envelope"></i> support@agriverse.com
      </div>
      <div class="info-item">
        <i class="fas fa-phone"></i> +91 98765 43210
      </div>
      <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d241317.11609846976!2d73.69815439268277!3d18.524890423025882!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bc2c09c69f45607%3A0xdea9aabf5e64a7e5!2sPune%2C%20Maharashtra!5e0!3m2!1sen!2sin!4v1696163330316!5m2!1sen!2sin" allowfullscreen="" loading="lazy"></iframe>
    </div>

    <div class="contact-form">
      <h2>💬 Send Us a Message</h2>
      <form id="contactForm" onsubmit="return handleSubmit(event)">
        <label for="name">Your Name:</label>
        <input type="text" id="name" required>

        <label for="email">Your Email:</label>
        <input type="email" id="email" required>

        <label for="message">Your Message:</label>
        <textarea id="message" rows="5" required></textarea>

        <button type="submit">Send Message</button>
      </form>
    </div>
  </div>

  <footer>
    © 2025 AgriVerse | Connecting Farmers, Globally 🌾
  </footer>

  <!-- Font Awesome for icons -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

  <script>
    function handleSubmit(event) {
      event.preventDefault();
      alert("✅ Thank you for contacting AgriVerse! We'll get back to you soon.");
      document.getElementById("contactForm").reset();
      return false;
    }
  </script>
</body>
</html>
